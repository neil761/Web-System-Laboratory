<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
    <link rel="stylesheet" href="list.css">
</head>
<body>
    
    <div class="container">
        <div class="row add-search g-4">
            <div class="search col" id="anime-list">
                <h2 class="header-title">List of Anime</h2>
                <input type="text" class="form-control search-anime-part" placeholder="Search">
                <ul class="unlist">

                    <li class="list-searchpart">
                        <div class="anime-info">
                            <p class="anime-title">Dragon Ball</p>
                            <small class="artist">Akira Toriyama</small>
                        </div>
                        <button class="delete">Delete</button>
                    </li>
                    <hr>
                    <li class="list-searchpart">
                        <div class="anime-info">
                            <p class="anime-title">One Piece</p>
                            <small class="artist">Eiichiro Oda</small>
                        </div>
                        <button class="delete">Delete</button>
                    </li>
                    <hr>
                    
                </ul>

            </div>
            
            <div class="add col" id="adding-anime">
                <h2 class="header-title">Add Anime</h2>

                <div class="addAnime">
                    <label for="anime-title" class="text-light">Anime:</label>
                    <form id="add-anime-title">
                        <input type="text" id="anime-title" name="anime-title" placeholder="Add Anime">
                    </form>
                </div>
                
                <div class="addArtist">
                    <label for="artist" class="text-light">Artist:</label>
                    <form id="add-artist">
                        <input type="text" id="artist" name="artist" placeholder="Artist">
                    </form>
                </div>


                <div class="Button-add">
                    <button id="add-button">Add</button>
                </div>          
                
            </div> 
        </div>
    </div>

</body>
<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
